name: dehaze-smoke
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dehazing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m dehaze_fusion synthetic --out demo_data --models 2
      - run: python -m dehaze_fusion train --data demo_data --epochs 5
      - run: python -m dehaze_fusion evaluate --data demo_data/test --checkpoint runs/gate/best.npz
